services:
  postgres:
    image: postgres:17-alpine
    container_name: zeeshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeeshop
      POSTGRES_USER: zeeshop_user
      POSTGRES_PASSWORD: zeeshop_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeeshop_user -d zeeshop"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  zeeshop-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeeshop-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/zeeshop
      JDBC_DATABASE_USERNAME: zeeshop_user
      JDBC_DATABASE_PASSWORD: zeeshop_password
      JDBC_DATABASE_DRIVER: org.postgresql.Driver
      APP_ENV: local

volumes:
  postgres_data:
